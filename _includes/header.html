<header class="masthead">
  <div class="shell masthead__row">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title_long }} — home">
      <img class="brand__logo" src="{{ '/assets/img/logo/vi-wordmark-ondark-medium.svg' | relative_url }}"
           alt="{{ site.title_long }}" width="154" height="44">
    </a>

    <button class="navToggle" aria-expanded="false" aria-controls="primaryNav">Menu</button>

    <nav class="nav" id="primaryNav" aria-label="Primary">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.label }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
