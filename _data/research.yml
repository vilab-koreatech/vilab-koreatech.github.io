- id: "SYN"
  title: "Controllable image synthesis"
  summary: "Diffusion and flow-based generation where the user keeps a handle on
            the result — layout, identity, and attributes that stay put when
            everything else changes."
  tags: ["Diffusion models", "Controllable generation", "Image editing"]

- id: "RES"
  title: "Image restoration"
  summary: "Recovering a clean, faithful image from a degraded capture — noise,
            blur, low light, compression and missing regions — across photos,
            video, RAW sensor data and scientific imaging. The restored result
            has to be right, not just look right."
  tags: ["Denoising", "Video restoration", "Inpainting & outpainting", "RAW imaging"]

- id: "USE"
  title: "Synthetic data for downstream tasks"
  summary: "What synthesis is ultimately for: training detection, segmentation
            and anomaly models when real labels run out — including applied
            settings such as industrial inspection and remote sensing."
  tags: ["Data augmentation", "Anomaly detection", "Segmentation", "Transfer"]